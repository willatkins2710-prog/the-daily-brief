name: Refresh news and publish The Daily Brief

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/fetch_news.py
      - .github/workflows/news.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: the-daily-brief-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public RSS headlines
        run: python scripts/fetch_news.py
      - name: Assemble website
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp news.json _site/news.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
